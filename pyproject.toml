[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xovi-zotero-bridge"
version = "0.1.0"
description = "On-demand Zotero to reMarkable bridge for xovi/rm-librarian"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyzotero>=1.6.11",
  "typer>=0.12.3",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
zotbridge = "zotbridge.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
